# Lychee link checker configuration
# https://github.com/lycheeverse/lychee

max_concurrency = 10
timeout = 10
max_retries = 3
method = "get"
cache = true
include_verbatim = false

# Accept statuses that CI IPs commonly receive for valid links
accept = [200, 201, 204, 403, 406, 429, 503]

exclude = [
    # Local and placeholder URLs
    'localhost',
    'http://127\.0\.0\.1',
    'example\.com',
    '\.well-known',

    # The site is deployed after merge, so self-referencing URLs cannot be
    # resolved from a PR build
    'https://ioc-project\.github\.io',

    # Private and internal repos that CI cannot access (the workflow token
    # gets a 404)
    'https://github\.com/cisco-eti/',
    'https://github\.com/ioc-project/',

    # /explorer/ is served outside this MkDocs build
    'file://.*/explorer/?$',

    # Lab not published upstream yet; remove once it exists in outshift-open/mas-lab
    'https://github\.com/outshift-open/mas-lab/tree/main/labs/ioc-motivation\.lab',

    # Templated URLs
    '\{[a-z_]+\}',

    # Sites that block or time out from GitHub Actions IPs
    'w3\.org',

    # Google Fonts (injected by mkdocs-material)
    'fonts\.googleapis\.com',
    'fonts\.gstatic\.com',
]

# 404.html has root-relative links that need a base URL
exclude_path = ['(^|/)404\.html$']

user_agent = "lychee/ioc-project.github.io"
