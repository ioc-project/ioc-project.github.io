<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1090" width="1600" height="1090" font-family="Inter, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#000000"/>

  <defs>
    <marker id="aCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17BFFF"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFA91F"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#65B168"/>
    </marker>
    <marker id="aNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1C5ED"/>
    </marker>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#858585"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1090" fill="#000000"/>

  <!-- ================= TITLE ================= -->
  <text x="60" y="38" font-size="25" font-weight="600" fill="#A3C3ED">Cognition Fabric Node</text>
  <text x="60" y="62" font-size="13.5" fill="#7F8FA4">The MAS attaches at two point types. COGS are cognitive amplifiers and reach the MAS read-only; GATs are guardrail technologies and return a disposition. Both run over one store, which lives inside SCOPE.</text>

  <!-- ================= MAS ================= -->
  <rect x="60" y="90" width="1480" height="76" rx="10" fill="#4083E5"/>
  <text x="800" y="122" font-size="26" font-weight="600" fill="#000000" text-anchor="middle">MAS</text>

  <rect x="398" y="140" width="240" height="52" rx="8" fill="#FFB40F" stroke="#FFC147" stroke-width="2.5"/>
  <text x="518" y="164" font-size="12.5" font-weight="600" fill="#FFEBC2" text-anchor="middle">Agent / SLIM point</text>
  <text x="518" y="180" font-size="9" fill="#FFE7A5" text-anchor="middle">interactive attachment</text>

  <rect x="710" y="140" width="240" height="52" rx="8" fill="#60943F" stroke="#88BD70" stroke-width="2.5"/>
  <text x="830" y="164" font-size="12.5" font-weight="600" fill="#C2E5B8" text-anchor="middle">Enforcement Point</text>
  <text x="830" y="180" font-size="9" fill="#B0D9A3" text-anchor="middle">in-path, returns disposition</text>

  <rect x="1330" y="140" width="80" height="52" rx="8" fill="#FFB40F" stroke="#FFC147" stroke-width="2.5"/>
  <rect x="1424" y="140" width="80" height="52" rx="8" fill="#60943F" stroke="#88BD70" stroke-width="2.5"/>

  <!-- ================= COGNITION FABRIC NODE ================= -->
  <rect x="60" y="230" width="1180" height="680" rx="14" fill="#01131B" stroke="#17BFFF" stroke-width="2.5"/>
  <text x="80" y="258" font-size="16" font-weight="600" fill="#7FD2F4">Cognition Fabric Node</text>

  <!-- ======== attachment couplings ======== -->
  <line x1="518" y1="340" x2="518" y2="196" stroke="#17BFFF" stroke-width="2.5" marker-end="url(#aCyan)"/>
  <text x="532" y="262" font-size="10" fill="#57D0FF">messages to / from MAS</text>
  <text x="532" y="276" font-size="10" fill="#57D0FF">(read-only) tool calling</text>

  <line x1="830" y1="340" x2="830" y2="196" stroke="#17BFFF" stroke-width="2.5" marker-start="url(#aCyan)" marker-end="url(#aCyan)"/>
  <text x="844" y="262" font-size="10" fill="#57D0FF">L9 messages / tool calls  ↑</text>
  <text x="844" y="276" font-size="10" fill="#57D0FF">disposition  ↓</text>

  <!-- ======== CF management ======== -->
  <rect x="84" y="292" width="250" height="320" rx="11" fill="#000000" stroke="#176480" stroke-width="2"/>
  <text x="209" y="320" font-size="14.5" font-weight="600" fill="#7FD2F4" text-anchor="middle">CF Management</text>
  <text x="209" y="340" font-size="14.5" font-weight="600" fill="#7FD2F4" text-anchor="middle">service</text>
  <text x="112" y="374" font-size="12" fill="#75B7D3">•  UI</text>
  <text x="112" y="400" font-size="12" fill="#75B7D3">•  Mgmt plane</text>
  <text x="112" y="426" font-size="12" fill="#75B7D3">•  Config DB</text>
  <ellipse cx="209" cy="478" rx="42" ry="13" fill="#AFC1D3"/>
  <rect x="167" y="478" width="84" height="58" fill="#AFC1D3"/>
  <ellipse cx="209" cy="536" rx="42" ry="13" fill="#AFC1D3"/>
  <ellipse cx="209" cy="497" rx="42" ry="13" fill="none" stroke="#7991A5" stroke-width="2"/>
  <ellipse cx="209" cy="516" rx="42" ry="13" fill="none" stroke="#7991A5" stroke-width="2"/>
  <text x="209" y="576" font-size="10" font-style="italic" fill="#7596A4" text-anchor="middle">declares which CEs exist</text>
  <text x="209" y="592" font-size="10" font-style="italic" fill="#7596A4" text-anchor="middle">and how they are chained</text>

  <rect x="84" y="632" width="250" height="180" rx="11" fill="#000000" stroke="#176480" stroke-width="2"/>
  <text x="209" y="706" font-size="14.5" font-weight="600" fill="#7FD2F4" text-anchor="middle">Audit service</text>
  <text x="209" y="734" font-size="10" font-style="italic" fill="#7596A4" text-anchor="middle">every disposition is</text>
  <text x="209" y="750" font-size="10" font-style="italic" fill="#7596A4" text-anchor="middle">recorded and replayable</text>

  <!-- ======== fabric core ======== -->
  <rect x="354" y="292" width="640" height="552" rx="12" fill="#000000" stroke="#176480" stroke-width="1.5"/>

  <rect x="372" y="340" width="292" height="64" rx="8" fill="#FFB40F" stroke="#FFC147" stroke-width="2"/>
  <text x="518" y="366" font-size="13" font-weight="600" fill="#FFEBC2" text-anchor="middle">Interactive</text>
  <text x="518" y="386" font-size="13" font-weight="600" fill="#FFEBC2" text-anchor="middle">Cognition Fabric APIs</text>

  <rect x="684" y="340" width="292" height="64" rx="8" fill="#60943F" stroke="#88BD70" stroke-width="2"/>
  <text x="830" y="366" font-size="13" font-weight="600" fill="#C2E5B8" text-anchor="middle">Enforcing</text>
  <text x="830" y="386" font-size="13" font-weight="600" fill="#C2E5B8" text-anchor="middle">Cognition Fabric APIs</text>

  <!-- CE row -->
  <rect x="372" y="436" width="112" height="76" rx="8" fill="#644B04" stroke="#C59526" stroke-width="2"/>
  <text x="428" y="470" font-size="12" font-weight="600" fill="#FFD794" text-anchor="middle">COGS</text>
  <text x="428" y="488" font-size="12" font-weight="600" fill="#FFD794" text-anchor="middle">CE 1</text>
  <rect x="495" y="436" width="112" height="76" rx="8" fill="#644B04" stroke="#C59526" stroke-width="2"/>
  <text x="551" y="470" font-size="12" font-weight="600" fill="#FFD794" text-anchor="middle">COGS</text>
  <text x="551" y="488" font-size="12" font-weight="600" fill="#FFD794" text-anchor="middle">CE 2</text>
  <rect x="618" y="436" width="112" height="76" rx="8" fill="#644B04" stroke="#C59526" stroke-width="2"/>
  <text x="674" y="470" font-size="12" font-weight="600" fill="#FFD794" text-anchor="middle">COGS</text>
  <text x="674" y="488" font-size="12" font-weight="600" fill="#FFD794" text-anchor="middle">CE 3</text>
  <rect x="741" y="436" width="112" height="76" rx="8" fill="#284317" stroke="#65964F" stroke-width="2"/>
  <text x="797" y="470" font-size="12" font-weight="600" fill="#B1D8AA" text-anchor="middle">GAT</text>
  <text x="797" y="488" font-size="12" font-weight="600" fill="#B1D8AA" text-anchor="middle">CE 4</text>
  <rect x="864" y="436" width="112" height="76" rx="8" fill="#284317" stroke="#65964F" stroke-width="2"/>
  <text x="920" y="470" font-size="12" font-weight="600" fill="#B1D8AA" text-anchor="middle">GAT</text>
  <text x="920" y="488" font-size="12" font-weight="600" fill="#B1D8AA" text-anchor="middle">CE 5</text>

  <!-- CE to API -->
  <line x1="428" y1="434" x2="428" y2="408" stroke="#FFA91F" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <line x1="551" y1="434" x2="551" y2="408" stroke="#FFA91F" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <path d="M666,434 L640,408" fill="none" stroke="#FFA91F" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <path d="M690,434 L716,408" fill="none" stroke="#FFA91F" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <line x1="797" y1="434" x2="797" y2="408" stroke="#65B168" stroke-width="2.5" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
  <line x1="920" y1="434" x2="920" y2="408" stroke="#65B168" stroke-width="2.5" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>

  <!-- CE to analytics -->
  <line x1="428" y1="514" x2="428" y2="546" stroke="#FFA91F" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <line x1="551" y1="514" x2="551" y2="546" stroke="#FFA91F" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <line x1="674" y1="514" x2="674" y2="546" stroke="#FFA91F" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <line x1="797" y1="514" x2="797" y2="546" stroke="#65B168" stroke-width="2.5" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
  <line x1="920" y1="514" x2="920" y2="546" stroke="#65B168" stroke-width="2.5" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>

  <rect x="372" y="548" width="604" height="58" rx="8" fill="#051A30" stroke="#2B5480" stroke-width="2"/>
  <text x="674" y="583" font-size="14" font-weight="600" fill="#A3C3ED" text-anchor="middle">Analytics Cognition Fabric APIs</text>

  <line x1="562" y1="610" x2="562" y2="640" stroke="#A1C5ED" stroke-width="2" marker-end="url(#aNavy)"/>
  <text x="552" y="630" font-size="10.5" fill="#A1C5ED" text-anchor="end">Publish</text>
  <line x1="712" y1="610" x2="712" y2="640" stroke="#A1C5ED" stroke-width="2" marker-end="url(#aNavy)"/>
  <text x="702" y="630" font-size="10.5" fill="#A1C5ED" text-anchor="end">Query</text>
  <line x1="772" y1="640" x2="772" y2="610" stroke="#A1C5ED" stroke-width="2" marker-end="url(#aNavy)"/>
  <text x="784" y="630" font-size="10.5" fill="#A1C5ED">Notify</text>

  <!-- ======== SCOPE, containing the Cognition store ======== -->
  <rect x="372" y="644" width="604" height="176" rx="10" fill="#73B0E1"/>
  <text x="674" y="670" font-size="13.5" font-weight="600" fill="#000000" text-anchor="middle">Observability / SCOPE</text>

  <rect x="392" y="686" width="564" height="80" rx="8" fill="#A1C5ED" stroke="#376692" stroke-width="1.5"/>
  <text x="674" y="712" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Cognition store</text>
  <text x="674" y="733" font-size="10.5" fill="#1F3D57" text-anchor="middle">Temporal KG · Latent space · Symbolic space · KV</text>
  <text x="674" y="754" font-size="9" font-style="italic" fill="#274C70" text-anchor="middle">inside SCOPE — the fabric reads it through the CF APIs</text>

  <text x="674" y="800" font-size="9.5" font-style="italic" fill="#152E42" text-anchor="middle">ingestion · trajectory reconstruction · enrichment · insight</text>

  <!-- ======== CFN routing ======== -->
  <rect x="1014" y="292" width="200" height="260" rx="11" fill="#000000" stroke="#17BFFF" stroke-width="2"/>
  <line x1="1114" y1="352" x2="1064" y2="326" stroke="#E5E5E5" stroke-width="2.5"/>
  <line x1="1114" y1="352" x2="1164" y2="326" stroke="#E5E5E5" stroke-width="2.5"/>
  <line x1="1114" y1="352" x2="1074" y2="392" stroke="#E5E5E5" stroke-width="2.5"/>
  <line x1="1114" y1="352" x2="1154" y2="392" stroke="#E5E5E5" stroke-width="2.5"/>
  <line x1="1114" y1="352" x2="1114" y2="308" stroke="#E5E5E5" stroke-width="2.5"/>
  <circle cx="1064" cy="326" r="9" fill="#E5E5E5"/>
  <circle cx="1164" cy="326" r="9" fill="#E5E5E5"/>
  <circle cx="1074" cy="392" r="9" fill="#E5E5E5"/>
  <circle cx="1154" cy="392" r="9" fill="#E5E5E5"/>
  <circle cx="1114" cy="308" r="9" fill="#E5E5E5"/>
  <circle cx="1114" cy="352" r="14" fill="#E5E5E5"/>
  <text x="1114" y="440" font-size="15" font-weight="600" fill="#7FD2F4" text-anchor="middle">CFN</text>
  <text x="1034" y="470" font-size="11.5" fill="#75B7D3">•  CE routing</text>
  <text x="1034" y="494" font-size="11.5" fill="#75B7D3">•  CE chaining</text>
  <text x="1114" y="526" font-size="9.5" font-style="italic" fill="#7596A4" text-anchor="middle">picks and sequences CEs</text>

  <!-- ================= PEER NODE ================= -->
  <rect x="1290" y="292" width="250" height="260" rx="14" fill="#01131B" stroke="#17BFFF" stroke-width="2.5"/>
  <text x="1415" y="400" font-size="16" font-weight="600" fill="#7FD2F4" text-anchor="middle">Cognition</text>
  <text x="1415" y="422" font-size="16" font-weight="600" fill="#7FD2F4" text-anchor="middle">Fabric Node</text>
  <text x="1415" y="450" font-size="10.5" font-style="italic" fill="#7596A4" text-anchor="middle">peer — same structure,</text>
  <text x="1415" y="466" font-size="10.5" font-style="italic" fill="#7596A4" text-anchor="middle">its own CEs and store</text>

  <line x1="1218" y1="422" x2="1286" y2="422" stroke="#17BFFF" stroke-width="3.5" marker-start="url(#aCyan)" marker-end="url(#aCyan)"/>
  <text x="1252" y="400" font-size="9.5" fill="#57D0FF" text-anchor="middle">federate</text>

  <line x1="1370" y1="292" x2="1370" y2="196" stroke="#17BFFF" stroke-width="2.5" marker-end="url(#aCyan)"/>
  <line x1="1464" y1="292" x2="1464" y2="196" stroke="#17BFFF" stroke-width="2.5" marker-start="url(#aCyan)" marker-end="url(#aCyan)"/>

  <!-- ================= TELEMETRY ================= -->
  <rect x="440" y="980" width="520" height="70" rx="10" fill="#919191"/>
  <text x="700" y="1014" font-size="16" font-weight="600" fill="#000000" text-anchor="middle">Otel Telemetry</text>
  <text x="700" y="1034" font-size="10" fill="#292929" text-anchor="middle">from the MAS and its attachment points</text>

  <line x1="700" y1="978" x2="700" y2="824" stroke="#17BFFF" stroke-width="2.5" marker-end="url(#aCyan)"/>
  <text x="714" y="900" font-size="10.5" fill="#57D0FF">realtime ingestion</text>

  <path d="M60,128 L28,128 L28,1015 L436,1015" fill="none" stroke="#858585" stroke-width="2" marker-end="url(#aGrey)"/>
  <text x="20" y="580" font-size="10" fill="#758291" text-anchor="middle" transform="rotate(-90 20 580)">MAS emits telemetry</text>

  <!-- ================= LEGEND ================= -->
  <text x="1415" y="620" font-size="10.5" font-style="italic" fill="#758291" text-anchor="middle">COGS — cognitive amplifiers</text>
  <text x="1415" y="638" font-size="10.5" font-style="italic" fill="#758291" text-anchor="middle">GAT — guardrail technologies</text>
  <text x="1415" y="666" font-size="10.5" font-style="italic" fill="#758291" text-anchor="middle">A COG may also serve the</text>
  <text x="1415" y="684" font-size="10.5" font-style="italic" fill="#758291" text-anchor="middle">enforcing surface (CE 3), but</text>
  <text x="1415" y="702" font-size="10.5" font-style="italic" fill="#758291" text-anchor="middle">only a GAT returns a disposition</text>
  <text x="1415" y="720" font-size="10.5" font-style="italic" fill="#758291" text-anchor="middle">that can block the MAS.</text>

<!-- ioc:dark sans="Helvetica Neue, Helvetica, Arial, sans-serif" --></svg>
