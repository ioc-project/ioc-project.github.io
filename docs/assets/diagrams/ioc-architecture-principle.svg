<rect x="188" y="470" width="580" height="130" rx="10" fill="#0B1B2E" stroke="#3C86E4" stroke-width="2"/>
<text x="212" y="502" font-size="19" font-weight="600" fill="#CFE2FA">Platform Engine</text>
<text x="212" y="526" font-size="15" fill="#98A2B4">the sensing substrate — one engine, both halves</text>
<rect x="212" y="542" width="12" height="12" rx="3" fill="#F0A020"/>
<text x="238" y="553" font-size="15" fill="#C9D6E6">detects — semantic, symbolic, RCA, waste</text>
<rect x="212" y="570" width="12" height="12" rx="3" fill="#F0A020"/>
<text x="238" y="581" font-size="15" fill="#C9D6E6">and fires the protocol response</text>

<rect x="808" y="470" width="580" height="130" rx="10" fill="#0B1B2E" stroke="#3C86E4" stroke-width="2"/>
<text x="832" y="502" font-size="19" font-weight="600" fill="#CFE2FA">SCOPE — KG + Cognition Store</text>
<text x="832" y="526" font-size="15" fill="#98A2B4">served to the engines through the CF APIs</text>
<rect x="832" y="542" width="12" height="12" rx="3" fill="#F0A020"/>
<text x="858" y="553" font-size="15" fill="#C9D6E6">Trajectory recomposition · knowledge graph</text>
<rect x="832" y="570" width="12" height="12" rx="3" fill="#F0A020"/>
<text x="858" y="581" font-size="15" fill="#C9D6E6">Persisted cognitive insight</text>

