<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, &apos;Helvetica Neue&apos;, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="100%" height="100%" fill="#000000"/>

  <defs>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#65B168"/>
    </marker>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#657585"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFA91F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#000000"/>

  <!-- ================= TITLE ================= -->
  <text x="60" y="38" font-size="24" font-weight="600" fill="#A3C3ED">AgentBridge + Sandbox — full replacement for sidecar + Envoy</text>
  <text x="60" y="62" font-size="13" fill="#7F8FA4">One choke point for all four traffic paths (C2A · A2A · A2LLM · A2MCP). The bridge mediates the wire; the sandbox contains the process.</text>

  <!-- ================= COLUMN 1: EXTERNAL PARTIES ================= -->
  <rect x="50" y="100" width="190" height="580" rx="12" fill="#030508" stroke="#212E3C" stroke-width="1.5"/>
  <text x="145" y="126" font-size="10.5" font-weight="600" fill="#657585" text-anchor="middle">ALL FOUR TRAFFIC PATHS</text>

  <rect x="64" y="140" width="162" height="118" rx="8" fill="#0E1113" stroke="#51656F" stroke-width="1.5"/>
  <text x="145" y="170" font-size="13" font-weight="600" fill="#B0C0C8" text-anchor="middle">Client</text>
  <text x="145" y="190" font-size="9.5" fill="#859FAB" text-anchor="middle">C2A · client → agent</text>
  <text x="145" y="208" font-size="9" font-style="italic" fill="#637B87" text-anchor="middle">ingress</text>

  <rect x="64" y="272" width="162" height="118" rx="8" fill="#0E1113" stroke="#51656F" stroke-width="1.5"/>
  <text x="145" y="302" font-size="13" font-weight="600" fill="#B0C0C8" text-anchor="middle">Other agents</text>
  <text x="145" y="322" font-size="9.5" fill="#859FAB" text-anchor="middle">A2A · agent → agent</text>
  <text x="145" y="340" font-size="9" font-style="italic" fill="#637B87" text-anchor="middle">coordination</text>

  <rect x="64" y="404" width="162" height="118" rx="8" fill="#0E1113" stroke="#51656F" stroke-width="1.5"/>
  <text x="145" y="434" font-size="13" font-weight="600" fill="#B0C0C8" text-anchor="middle">LLM API</text>
  <text x="145" y="454" font-size="9.5" fill="#859FAB" text-anchor="middle">A2LLM · agent → LLM</text>
  <text x="145" y="472" font-size="9" font-style="italic" fill="#637B87" text-anchor="middle">egress</text>

  <rect x="64" y="536" width="162" height="118" rx="8" fill="#0E1113" stroke="#51656F" stroke-width="1.5"/>
  <text x="145" y="566" font-size="13" font-weight="600" fill="#B0C0C8" text-anchor="middle">MCP server / tools</text>
  <text x="145" y="586" font-size="9.5" fill="#859FAB" text-anchor="middle">A2MCP · agent → tool</text>
  <text x="145" y="604" font-size="9" font-style="italic" fill="#637B87" text-anchor="middle">tool calling</text>

  <text x="145" y="674" font-size="9" font-style="italic" fill="#758291" text-anchor="middle">the same four paths sidecar + Envoy</text>
  <text x="145" y="688" font-size="9" font-style="italic" fill="#758291" text-anchor="middle">used to front, one by one</text>

  <line x1="226" y1="199" x2="250" y2="199" stroke="#657585" stroke-width="2"/>
  <line x1="226" y1="331" x2="250" y2="331" stroke="#657585" stroke-width="2"/>
  <line x1="226" y1="463" x2="250" y2="463" stroke="#657585" stroke-width="2"/>
  <line x1="226" y1="595" x2="250" y2="595" stroke="#657585" stroke-width="2"/>
  <line x1="250" y1="199" x2="250" y2="595" stroke="#657585" stroke-width="2"/>
  <line x1="250" y1="397" x2="280" y2="397" stroke="#657585" stroke-width="2.5" marker-end="url(#aGrey)"/>

  <!-- ================= COLUMN 2: AGENTBRIDGE ================= -->
  <rect x="280" y="100" width="380" height="580" rx="14" fill="#0E1608" stroke="#88BD70" stroke-width="2.5"/>
  <text x="300" y="130" font-size="15" font-weight="600" fill="#C2E5B8">AgentBridge (SLIM-enabled)</text>
  <text x="300" y="150" font-size="10.5" font-style="italic" fill="#A4D194">single choke point — declared endpoint, not a hidden interceptor</text>

  <rect x="296" y="164" width="348" height="68" rx="8" fill="#60943F" stroke="#88BD70" stroke-width="1.5"/>
  <text x="470" y="190" font-size="12.5" font-weight="600" fill="#C2E5B8" text-anchor="middle">C2A ingress</text>
  <text x="470" y="210" font-size="9.5" fill="#B0D9A3" text-anchor="middle">legitimate front door — no interception dilemma</text>

  <rect x="296" y="240" width="348" height="68" rx="8" fill="#60943F" stroke="#88BD70" stroke-width="1.5"/>
  <text x="470" y="266" font-size="12.5" font-weight="600" fill="#C2E5B8" text-anchor="middle">SLIM MLS group member</text>
  <text x="470" y="286" font-size="9.5" fill="#B0D9A3" text-anchor="middle">→ other agents (A2A)</text>

  <rect x="296" y="316" width="348" height="68" rx="8" fill="#60943F" stroke="#88BD70" stroke-width="1.5"/>
  <text x="470" y="342" font-size="12.5" font-weight="600" fill="#C2E5B8" text-anchor="middle">LLM-egress broker</text>
  <text x="470" y="362" font-size="9.5" fill="#B0D9A3" text-anchor="middle">holds the credential → LLM API (A2LLM)</text>

  <rect x="296" y="392" width="348" height="68" rx="8" fill="#60943F" stroke="#88BD70" stroke-width="1.5"/>
  <text x="470" y="418" font-size="12.5" font-weight="600" fill="#C2E5B8" text-anchor="middle">SLIM MCP endpoint</text>
  <text x="470" y="438" font-size="9" fill="#B0D9A3" text-anchor="middle">→ MCP server / tools; confined fallback for non-SLIM peers</text>

  <rect x="296" y="468" width="348" height="68" rx="8" fill="#284317" stroke="#65964F" stroke-width="1.5"/>
  <text x="470" y="494" font-size="12.5" font-weight="600" fill="#C2E5B8" text-anchor="middle">CE mediation</text>
  <text x="470" y="514" font-size="9.5" fill="#B0D9A3" text-anchor="middle">submit → Disposition (allow/block/modify/inject) → apply</text>

  <rect x="296" y="544" width="348" height="68" rx="8" fill="#000000" stroke="#65964F" stroke-width="1.5"/>
  <text x="470" y="570" font-size="12.5" font-weight="600" fill="#C2E5B8" text-anchor="middle">Evidence</text>
  <text x="470" y="590" font-size="9.5" fill="#B0D9A3" text-anchor="middle">one audit record per mediated item</text>

  <!-- ================= COLUMN 3: SANDBOX ================= -->
  <line x1="660" y1="397" x2="690" y2="397" stroke="#65B168" stroke-width="3" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
  <text x="675" y="382" font-size="8.5" font-style="italic" fill="#A4D194" text-anchor="middle">only</text>
  <text x="675" y="422" font-size="8.5" font-style="italic" fill="#A4D194" text-anchor="middle">route</text>

  <rect x="690" y="100" width="380" height="580" rx="14" fill="#000204" stroke="#384E65" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="710" y="130" font-size="15" font-weight="600" fill="#7F8FA4">Sandbox (pluggable backend)</text>
  <text x="710" y="150" font-size="10.5" font-style="italic" fill="#657585">process / runtime plane — one per agent session</text>

  <rect x="706" y="164" width="348" height="90" rx="10" fill="#4083E5"/>
  <text x="880" y="196" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">Agent process</text>
  <text x="880" y="216" font-size="9.5" fill="#082130" text-anchor="middle">unmodified workload — no CA, no trust-store injection</text>
  <text x="880" y="234" font-size="9.5" font-style="italic" fill="#082130" text-anchor="middle">only reaches the world through the bridge</text>

  <line x1="880" y1="254" x2="880" y2="280" stroke="#88BD70" stroke-width="3" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>

  <rect x="706" y="284" width="168" height="110" rx="8" fill="#0E1608" stroke="#65964F" stroke-width="1.5"/>
  <text x="790" y="310" font-size="12" font-weight="600" fill="#C2E5B8" text-anchor="middle">Secret store</text>
  <text x="790" y="330" font-size="9.5" fill="#A4D194" text-anchor="middle">inject_secret() —</text>
  <text x="790" y="348" font-size="9.5" fill="#A4D194" text-anchor="middle">gated on identity</text>
  <text x="790" y="368" font-size="8.5" font-style="italic" fill="#95B585" text-anchor="middle">shadi agent_secrets / SPI</text>

  <rect x="886" y="284" width="168" height="110" rx="8" fill="#0E1608" stroke="#65964F" stroke-width="1.5"/>
  <text x="970" y="310" font-size="12" font-weight="600" fill="#C2E5B8" text-anchor="middle">network_policy()</text>
  <text x="970" y="330" font-size="9.5" fill="#A4D194" text-anchor="middle">egress allow-list:</text>
  <text x="970" y="348" font-size="9.5" fill="#A4D194" text-anchor="middle">bridge socket only</text>
  <text x="970" y="368" font-size="8.5" font-style="italic" fill="#95B585" text-anchor="middle">no cooperative bypass</text>

  <line x1="880" y1="394" x2="880" y2="418" stroke="#88BD70" stroke-width="3" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>

  <rect x="706" y="422" width="348" height="192" rx="10" fill="#000000" stroke="#65964F" stroke-width="1.5"/>
  <text x="880" y="446" font-size="12.5" font-weight="600" fill="#A3C3ED" text-anchor="middle">SPI backends — pick one</text>

  <rect x="716" y="458" width="163" height="42" rx="7" fill="#01131B" stroke="#17BFFF" stroke-width="1.2"/>
  <text x="797" y="475" font-size="11" font-weight="600" fill="#7FD2F4" text-anchor="middle">SHADI</text>
  <text x="797" y="491" font-size="8.5" fill="#5999B5" text-anchor="middle">preferred — SLIM + secrets native</text>

  <rect x="887" y="458" width="157" height="42" rx="7" fill="#090F17" stroke="#3F5670" stroke-width="1.2"/>
  <text x="965" y="475" font-size="10.5" font-weight="600" fill="#A1C5ED" text-anchor="middle">Docker Sandboxes</text>
  <text x="965" y="491" font-size="8.5" fill="#7F99B5" text-anchor="middle">fast default, microVM</text>

  <rect x="716" y="506" width="163" height="42" rx="7" fill="#090F17" stroke="#3F5670" stroke-width="1.2"/>
  <text x="797" y="523" font-size="10.5" font-weight="600" fill="#A1C5ED" text-anchor="middle">agent-sandbox</text>
  <text x="797" y="539" font-size="8.5" fill="#7F99B5" text-anchor="middle">browser / computer use</text>

  <rect x="887" y="506" width="157" height="42" rx="7" fill="#090F17" stroke="#3F5670" stroke-width="1.2"/>
  <text x="965" y="523" font-size="10.5" font-weight="600" fill="#A1C5ED" text-anchor="middle">agent-infra/sandbox</text>
  <text x="965" y="539" font-size="8.5" fill="#7F99B5" text-anchor="middle">all-in-one container</text>

  <rect x="716" y="554" width="328" height="42" rx="7" fill="#030508" stroke="#212E3C" stroke-width="1.2"/>
  <text x="880" y="571" font-size="10.5" font-weight="600" fill="#95A9BF" text-anchor="middle">raw microVM (Firecracker / gVisor)</text>
  <text x="880" y="587" font-size="8.5" font-style="italic" fill="#657585" text-anchor="middle">build-your-own — deferred until a partner asks</text>

  <text x="880" y="638" font-size="9" font-style="italic" fill="#657585" text-anchor="middle">every backend implements the same six SPI operations</text>
  <text x="880" y="654" font-size="9" font-style="italic" fill="#657585" text-anchor="middle">provision · inject_secret · network_policy · filesystem_policy · attest · destroy</text>

  <!-- ================= CONTRACT ARROWS ================= -->
  <text x="1115" y="378" font-size="11" font-weight="600" fill="#A4D194" text-anchor="middle">SUBMIT ▶</text>
  <text x="1115" y="393" font-size="11" font-weight="600" fill="#A4D194" text-anchor="middle">◀ DISPOSITION</text>
  <line x1="1070" y1="405" x2="1160" y2="405" stroke="#65B168" stroke-width="3.5" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
  <text x="1115" y="422" font-size="9" fill="#88BD70" text-anchor="middle">ioc.ce.v1</text>

  <path d="M1054,568 L1115,568 L1115,455" fill="none" stroke="#657585" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aGrey)"/>
  <text x="1115" y="545" font-size="9" font-style="italic" fill="#8596A5" text-anchor="middle">evidence</text>

  <!-- ================= COLUMN 4: COGNITION FABRIC ================= -->
  <rect x="1160" y="100" width="390" height="580" rx="14" fill="#01131B" stroke="#17BFFF" stroke-width="2.5"/>
  <text x="1180" y="130" font-size="15" font-weight="600" fill="#7FD2F4">Cognition Fabric (CF)</text>
  <text x="1180" y="150" font-size="10.5" font-style="italic" fill="#5999B5">peer T3 — same Enforcing contract</text>

  <rect x="1186" y="164" width="230" height="110" rx="9" fill="#60943F" stroke="#88BD70" stroke-width="2"/>
  <text x="1301" y="188" font-size="12.5" font-weight="600" fill="#C2E5B8" text-anchor="middle">Enforcing CF APIs</text>
  <text x="1301" y="206" font-size="9.5" fill="#B0D9A3" text-anchor="middle">ioc.ce.v1 · req / resp</text>
  <rect x="1194" y="218" width="50" height="26" rx="5" fill="#284317" stroke="#88BD70" stroke-width="1.2"/>
  <text x="1219" y="236" font-size="9" font-weight="600" fill="#C2E5B8" text-anchor="middle">allow</text>
  <rect x="1248" y="218" width="50" height="26" rx="5" fill="#270D09" stroke="#D44D3F" stroke-width="1.2"/>
  <text x="1273" y="236" font-size="9" font-weight="600" fill="#E17F73" text-anchor="middle">block</text>
  <rect x="1302" y="218" width="50" height="26" rx="5" fill="#644B04" stroke="#C59526" stroke-width="1.2"/>
  <text x="1327" y="236" font-size="8.5" font-weight="600" fill="#FFD794" text-anchor="middle">modify</text>
  <rect x="1356" y="218" width="50" height="26" rx="5" fill="#644B04" stroke="#C59526" stroke-width="1.2"/>
  <text x="1381" y="236" font-size="8.5" font-weight="600" fill="#FFD794" text-anchor="middle">inject</text>

  <rect x="1186" y="286" width="230" height="64" rx="9" fill="#73B0E1"/>
  <text x="1301" y="310" font-size="11.5" font-weight="600" fill="#000000" text-anchor="middle">CF ingestion · tracing</text>
  <text x="1301" y="328" font-size="9.5" font-style="italic" fill="#274C70" text-anchor="middle">acknowledgments only</text>

  <rect x="1186" y="362" width="230" height="80" rx="9" fill="#A1C5ED"/>
  <text x="1301" y="386" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Cognition Store</text>
  <text x="1301" y="406" font-size="9.5" fill="#1F3D57" text-anchor="middle">prior findings enrich next submission</text>
  <text x="1301" y="424" font-size="8.5" font-style="italic" fill="#3F6080" text-anchor="middle">receives evidence from bridge + sandbox</text>

  <rect x="1428" y="164" width="112" height="380" rx="11" fill="#372A02" stroke="#FFA91F" stroke-width="2.5"/>
  <text x="1484" y="194" font-size="12.5" font-weight="600" fill="#FFD385" text-anchor="middle">Cognition</text>
  <text x="1484" y="212" font-size="12.5" font-weight="600" fill="#FFD385" text-anchor="middle">Engines</text>
  <text x="1484" y="234" font-size="9" fill="#EFBF75" text-anchor="middle">decide the</text>
  <text x="1484" y="248" font-size="9" font-weight="600" fill="#EFBF75" text-anchor="middle">Disposition</text>
  <line x1="1440" y1="264" x2="1528" y2="264" stroke="#75551F" stroke-width="1.5"/>
  <text x="1484" y="288" font-size="9.5" fill="#EFBF75" text-anchor="middle">CASA</text>
  <text x="1484" y="306" font-size="9" fill="#EFBF75" text-anchor="middle">Security Detections</text>
  <text x="1484" y="324" font-size="9.5" fill="#EFBF75" text-anchor="middle">Detective</text>
  <text x="1484" y="470" font-size="8.5" font-style="italic" fill="#AF8F5F" text-anchor="middle">out of scope for</text>
  <text x="1484" y="486" font-size="8.5" font-style="italic" fill="#AF8F5F" text-anchor="middle">the bridge / sandbox</text>
  <text x="1484" y="520" font-size="8.5" fill="#EFBF75" text-anchor="middle">consume trajectories</text>
  <text x="1484" y="534" font-size="8.5" fill="#EFBF75" text-anchor="middle">and prior findings</text>

  <line x1="1416" y1="219" x2="1426" y2="219" stroke="#65B168" stroke-width="2" marker-end="url(#aGreen)"/>
  <path d="M1416,402 L1560,402 L1560,340" fill="none" stroke="#FFA91F" stroke-width="2" marker-end="url(#aOrange)"/>

  <!-- ================= FOOTER ================= -->
  <rect x="60" y="710" width="480" height="150" rx="10" fill="#030508" stroke="#212E3C" stroke-width="1.5"/>
  <text x="78" y="736" font-size="12" font-weight="600" fill="#A3C3ED">Full replacement, not an added flavor</text>
  <text x="78" y="760" font-size="9.5" fill="#7F99B5">Bridge + Sandbox becomes the default enforcement</text>
  <text x="78" y="776" font-size="9.5" fill="#7F99B5">point for a MAS — C2A, A2A, A2LLM, A2MCP alike.</text>
  <text x="78" y="800" font-size="9.5" font-style="italic" fill="#657585">Sidecar + Envoy is retired for agent traffic, not kept</text>
  <text x="78" y="816" font-size="9.5" font-style="italic" fill="#657585">as a parallel path.</text>
  <text x="78" y="840" font-size="9" font-style="italic" fill="#657585">Six enforcement-proxy flavors collapse toward one</text>
  <text x="78" y="854" font-size="9" font-style="italic" fill="#657585">bridge / sandbox pattern.</text>

  <rect x="570" y="710" width="480" height="150" rx="10" fill="#0E1608" stroke="#65964F" stroke-width="1.5"/>
  <text x="588" y="736" font-size="12" font-weight="600" fill="#C2E5B8">Two evidence trails</text>
  <text x="588" y="760" font-size="9.5" fill="#A4D194">Bridge: one audit record per mediated message</text>
  <text x="588" y="776" font-size="9.5" fill="#A4D194">(submitted · disposition · applied · trace ID).</text>
  <text x="588" y="800" font-size="9.5" fill="#A4D194">Sandbox: one attestation record per session</text>
  <text x="588" y="816" font-size="9.5" fill="#A4D194">(image · secrets accessed · egress attempts).</text>
  <text x="588" y="840" font-size="9" font-style="italic" fill="#95B585">A block record proves the call never happened.</text>

  <rect x="1080" y="710" width="480" height="150" rx="10" fill="#372A02" stroke="#FFA91F" stroke-width="1.5"/>
  <text x="1098" y="736" font-size="12" font-weight="600" fill="#FFD385">Explicit, labeled fallback only</text>
  <text x="1098" y="760" font-size="9.5" fill="#EFBF75">A peer / tool server that can't yet speak SLIM, or a</text>
  <text x="1098" y="776" font-size="9.5" fill="#EFBF75">workload that can't run sandboxed, falls back to one</text>
  <text x="1098" y="792" font-size="9.5" fill="#EFBF75">confined proxy at the MCP boundary, or legacy</text>
  <text x="1098" y="808" font-size="9.5" fill="#EFBF75">per-agent MITM.</text>
  <text x="1098" y="832" font-size="9" font-style="italic" fill="#AF8F5F">Never the default — always visible in the evidence.</text>

<!-- ioc:dark sans="Helvetica Neue, Helvetica, Arial, sans-serif" --></svg>
